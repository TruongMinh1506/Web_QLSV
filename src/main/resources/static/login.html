<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập hệ thống</title>
    <script>
      const savedTheme = localStorage.getItem("theme") || "light";
      document.documentElement.setAttribute("data-theme", savedTheme);
    </script>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="auth-page">
<div class="auth-shell">
    <section class="card auth-card">
        <div>
            <h1>Đăng nhập hệ thống</h1>
            
        </div>

        <form id="loginForm" class="auth-form">
            <label>
                <span>Tên đăng nhập</span>
                <input id="username" type="text" autocomplete="username" placeholder="Nhập tài khoản">
            </label>
            <label>
                <span>Mật khẩu</span>
                <input id="password" type="password" autocomplete="current-password" placeholder="Nhập mật khẩu">
            </label>
            <p id="loginError" class="auth-error hidden"></p>
            <button id="loginBtn" class="primary-btn auth-submit" type="submit">Đăng nhập</button>
        </form>

    </section>
</div>
<script src="assets/js/login.js"></script>
</body>
</html>
